# --- Tutorial step copy (Watson's voice; command names stay Latin) ---
tutorial.move.s1=Empecemos por tus pies, detective. Estás en el Estudio. Para dar un paso al este, hacia el Salón, escribe: move east
tutorial.move.s2=Bien hecho: una nueva sala, una nueva vista. Ahora regresa pulsando el botón "west: Study" en el panel de salas contiguas a la derecha.
tutorial.move.s3=Así es. Seguir una pista no es más que pasar de una sala a otra. Escribe continue cuando estés listo.
tutorial.look.s1=Cuando los detalles de una sala se te escapen, basta con mirar de nuevo. Escribe: look
tutorial.look.s2=Ahí está: la sala, su contenido y sus salidas, anotados otra vez. Apóyate en 'look' siempre que tu memoria necesite un empujón. Escribe continue.
tutorial.examine.s1=Todo caso gira en torno a pequeñas cosas. Sobre el escritorio yace una carta rasgada. Examínala: escribe examine torn_letter
tutorial.examine.s2=Bien. Su descripción aparece impresa para ti y se guarda en tu Diario. Ahora examina la otra pista: examine muddy_boot
tutorial.examine.s3=Dos pistas reunidas ya. Examinar es el primerísimo instinto del detective. Escribe continue.
tutorial.question.s1=El ayuda de cámara se queda en el Salón, al este del Estudio. Ve hasta él: escribe move east
tutorial.question.s2=Un sospechoso sirve de poco hasta que habla. Ahora interrógalo: escribe question the valet
tutorial.question.s3=Su declaración queda anotada en tu Diario. Guárdala bien, pues los sospechosos no siempre dicen la verdad. Escribe continue.
tutorial.deduce.s1=Deducir es sacar una conclusión firme de una pista, pero gasta una Ficha de perspicacia, así que elige bien el momento. Prueba: deduce torn_letter
tutorial.deduce.s2=Una intuición más aguda, y guardada en tu Diario. Gasta tus fichas donde más importen. Escribe continue.
tutorial.contradict.s1=Para romper una mentira primero debes tener la prueba. Examina la bota embarrada: escribe examine muddy_boot
tutorial.contradict.s2=Ahora lleva esa prueba ante el hombre en persona. Da un paso al este, hacia el Salón: move east
tutorial.contradict.s3=El ayuda de cámara jura que nunca salió de la cocina. Enfréntalo con la bota. Escribe exactamente: contradict muddy_boot with the valet
tutorial.contradict.s4=¡Su coartada se hace pedazos! Cuida el orden: primero la prueba, luego 'with', y después el sospechoso. Escribe continue.
tutorial.combine.s1=Dos pistas pueden decir más juntas que por separado. Primero reúnelas ambas. Escribe: examine torn_letter
tutorial.combine.s2=Y ahora la segunda: examine muddy_boot
tutorial.combine.s3=Ahora entrelázalas en una. Escribe: combine torn_letter muddy_boot
tutorial.combine.s4=Una nueva deducción, mayor que sus partes. Combina pistas siempre que parezcan compartir un hilo. Escribe continue.
tutorial.journal.s1=Tu Diario guarda cada pista que descubres. Ábrelo: escribe journal (o haz clic en Diario arriba).
tutorial.journal.s2=También puedes tomar tus propias notas. Añade una — escribe: journal add The valet seemed nervous — o simplemente escribe The valet seemed nervous en la ventana del Diario y pulsa el botón Añadir nota.
tutorial.journal.s3=Guardado. Un diario ordenado es la memoria más segura del detective. Escribe continue.
tutorial.tasks.s1=¿No sabes hacia dónde ir? Tus pistas actuales viven en Tareas. Escribe: tasks (o haz clic en Tareas arriba).
tutorial.tasks.s2=No pierdas de vista tus tareas: te muestran el camino cuando un caso se enreda. Escribe continue.
tutorial.pinboard.s1=Todo lo que has reunido ya está en el tablero: las pistas, la declaración del ayuda de cámara y él mismo. Abre el Tablero de pistas desde la barra superior.
tutorial.pinboard.s2=Activa el Modo de enlace y luego haz clic en la declaración del ayuda de cámara y en la bota embarrada para trazar un hilo entre la mentira y la prueba.
tutorial.pinboard.s3=Ahora expón la mentira desde el tablero: selecciona la declaración del ayuda de cámara y la bota embarrada, y pulsa Contradecir.
tutorial.pinboard.s4=Las deducciones también se forjan aquí. Selecciona la carta rota y la bota embarrada, y pulsa Combinar.
tutorial.pinboard.s5=Ese es el oficio del detective, hecho a mano en el tablero. Escribe continue.
tutorial.askWatson.s1=Cuando la pista se enfríe, siempre me alegra ofrecer una idea. Pregúntame: escribe ask watson
tutorial.askWatson.s2=También puedes preguntar por algo en concreto. Escribe: ask watson torn_letter
tutorial.askWatson.s3=Un amigo en la niebla, si se me permite decirlo. Algunas preguntas cuestan una Ficha de perspicacia, así que pregunta con propósito. Escribe continue.
tutorial.finalExam.s1=Cuando por fin puedas nombrar al culpable, te aguarda el Examen final. Escribe 'final exam' (o haz clic en Examen final arriba) para comenzar.
tutorial.finalExam.s2=Quedan dos preguntas. Responde la primera aquí en la terminal: escribe los números de opción para ambos huecos: 1,1
tutorial.finalExam.s3=Ahora responde la segunda pregunta en la ventana del examen: elige una opción para el hueco y pulsa Enviar.
tutorial.finalExam.s4=Dominaste ambas vías: por la terminal y por la ventana del examen. Se muestra tu rango. Escribe continue.
tutorial.practice.s1=Esta es tu graduación, detective: un caso entero, desde la primera pista hasta la última palabra. Tómate tu tiempo; aquí nada puede salir mal. Escribe continue para empezar.
tutorial.practice.s2=Sobre el escritorio yace una carta rasgada. Empieza como siempre: examine torn_letter
tutorial.practice.s3=Ahora saca una conclusión de ella: deduce torn_letter
tutorial.practice.s4=Cerca hay una bota embarrada. Examínala: examine muddy_boot
tutorial.practice.s5=Dos pistas que comparten un hilo. Combínalas: combine torn_letter muddy_boot
tutorial.practice.s6=La prueba está lista. Ahora al sospechoso: da un paso al este: move east
tutorial.practice.s7=Escucha al ayuda de cámara antes de acusarlo: question the valet
tutorial.practice.s8=Miente. Rompe su coartada con la bota: contradict muddy_boot with the valet
tutorial.practice.s9=Magnífico: la verdad es tuya. Cuando estés listo de veras, el Examen final es donde lo nombrarías. Has aprendido el oficio, detective. Escribe continue.

