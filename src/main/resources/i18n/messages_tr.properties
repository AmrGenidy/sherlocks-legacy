# --- Tutorial step copy (Watson's voice; command names stay Latin) ---
tutorial.move.s1=Ayaklarınızla başlıyoruz, dedektif. Çalışma odasındasınız. Doğuya, Salon'a adım atmak için şunu yazın: move east
tutorial.move.s2=Aferin — yeni bir oda, yeni bir manzara. Şimdi sağdaki Komşu odalar panelindeki "west: Study" düğmesine basarak geri dönün.
tutorial.move.s3=İşte böyle. Bir izi takip etmek, odadan odaya geçmekten başka bir şey değildir. Hazır olduğunuzda continue yazın.
tutorial.look.s1=Bir odanın ayrıntıları aklınızdan kaçtığında, sadece yeniden bakın. Şunu yazın: look
tutorial.look.s2=İşte — oda, içindekiler ve çıkışları, yeniden ortaya seriliyor. Hafızanızın bir dürtüye ihtiyacı olduğunda 'look' komutuna güvenin. continue yazın.
tutorial.examine.s1=Her vaka küçük şeyler üzerinde döner. Masada yırtık bir mektup duruyor. Onu inceleyin — şunu yazın: examine torn_letter
tutorial.examine.s2=Güzel. Açıklaması sizin için yazıldı ve Günlüğünüze kaydedildi. Şimdi diğer ipucunu inceleyin: examine muddy_boot
tutorial.examine.s3=Çoktan iki ipucu toplandı. İncelemek, dedektifin ilk içgüdüsüdür. continue yazın.
tutorial.question.s1=Uşak, Çalışma Odası'nın doğusundaki Salon'da kalır. Ona gidin — şunu yazın: move east
tutorial.question.s2=Bir şüpheli konuşana dek pek bir işe yaramaz. Şimdi uşağı sorgulayın — şunu yazın: question the valet
tutorial.question.s3=İfadesi Günlüğünüze kaydedildi. Onu yakından izleyin, çünkü şüpheliler her zaman doğruyu söylemez. continue yazın.
tutorial.deduce.s1=Çıkarım yapmak, bir ipucundan kesin bir sonuca varmaktır — ama bir Kavrayış Jetonu harcar, bu yüzden anınızı iyi seçin. Şunu deneyin: deduce torn_letter
tutorial.deduce.s2=Daha keskin bir kavrayış ve Günlüğünüze kaydedildi. Jetonlarınızı en çok önem taşıdıkları yerde harcayın. continue yazın.
tutorial.contradict.s1=Bir yalanı bozmak için önce kanıtı elinizde tutmalısınız. Çamurlu çizmeyi inceleyin — şunu yazın: examine muddy_boot
tutorial.contradict.s2=Şimdi o kanıtı adamın kendisine götürün. Doğuya, Salon'a adım atın: move east
tutorial.contradict.s3=Uşak mutfaktan hiç çıkmadığına yemin ediyor. Onu çizmeyle yüzleştirin. Tam olarak şunu yazın: contradict muddy_boot with the valet
tutorial.contradict.s4=Mazereti paramparça oluyor! Sıraya dikkat edin: önce kanıt, sonra 'with', sonra şüpheli. continue yazın.
tutorial.combine.s1=İki ipucu birlikte, ayrı olduklarından daha fazlasını söyleyebilir. Önce ikisini de toplayın. Şunu yazın: examine torn_letter
tutorial.combine.s2=Ve şimdi ikincisi: examine muddy_boot
tutorial.combine.s3=Şimdi onları tek bir şeyde örün. Şunu yazın: combine torn_letter muddy_boot
tutorial.combine.s4=Parçalarından daha büyük, yeni bir çıkarım. İpuçları ortak bir iz paylaşır gibi göründüğünde onları birleştirin. continue yazın.
tutorial.journal.s1=Günlüğünüz ortaya çıkardığınız her ipucunu saklar. Onu açın — şunu yazın: journal (ya da yukarıdaki Günlük'e tıklayın).
tutorial.journal.s2=Kendi notlarını da tutabilirsin. Bir tane ekle — şunu yaz: journal add The valet seemed nervous — ya da Günlük penceresine The valet seemed nervous yazıp Not ekle düğmesine bas.
tutorial.journal.s3=Kaydedildi. Düzenli bir günlük, dedektifin en sağlam hafızasıdır. continue yazın.
tutorial.tasks.s1=Sonra nereye döneceğinizden emin değil misiniz? Mevcut izleriniz Görevler'de bulunur. Şunu yazın: tasks (ya da yukarıdaki Görevler'e tıklayın).
tutorial.tasks.s2=Görevlerinize bir göz atın — bir vaka karmaşıklaştığında yolu onlar gösterir. continue yazın.
tutorial.pinboard.s1=Topladığın her şey zaten panoda — ipuçları, uşağın ifadesi ve uşağın kendisi. Üst çubuktan Pano'yu aç.
tutorial.pinboard.s2=Bağlantı modunu aç, ardından yalanla onu çürüten kanıt arasında bir iplik çekmek için uşağın ifadesine ve çamurlu çizmeye tıkla.
tutorial.pinboard.s3=Şimdi yalanı panodan ifşa et: uşağın ifadesini ve çamurlu çizmeyi seç, sonra Çürüt'e bas.
tutorial.pinboard.s4=Çıkarımlar da burada dövülür. Yırtık mektubu ve çamurlu çizmeyi seç, sonra Birleştir'e bas.
tutorial.pinboard.s5=İşte dedektifin zanaatı, panoda elle yapılmış. continue yaz.
tutorial.askWatson.s1=İz soğuduğunda, bir fikir sunmaktan her zaman memnuniyet duyarım. Bana sorun — şunu yazın: ask watson
tutorial.askWatson.s2=Belirli bir şey hakkında da sorabilirsiniz. Şunu yazın: ask watson torn_letter
tutorial.askWatson.s3=Siste bir dost, söylememe izin verirseniz. Bazı sorular bir Kavrayış Jetonuna mal olur, bu yüzden amaca yönelik sorun. continue yazın.
tutorial.finalExam.s1=Sonunda suçluyu işaret edebildiğinizde, Final Sınavı sizi bekler. Başlamak için 'final exam' yazın (ya da yukarıdaki Final sınavı'na tıklayın).
tutorial.finalExam.s2=İki soru kaldı. İlkini burada terminalde yanıtlayın — iki boşluk için seçenek numaralarını yazın: 1,1
tutorial.finalExam.s3=Şimdi ikinci soruyu sınav penceresinde yanıtlayın: boşluk için bir seçenek seçin ve Gönder'e basın.
tutorial.finalExam.s4=Her iki yolu da öğrendiniz — terminalle ve sınav penceresiyle. Rütbeniz gösteriliyor. continue yazın.
tutorial.practice.s1=Bu sizin mezuniyetiniz, dedektif — ilk ipucundan son söze kadar koca bir vaka. Acele etmeyin; burada hiçbir şey ters gidemez. Başlamak için continue yazın.
tutorial.practice.s2=Masada yırtık bir mektup duruyor. Her zamanki gibi başlayın — examine torn_letter
tutorial.practice.s3=Şimdi ondan bir sonuç çıkarın: deduce torn_letter
tutorial.practice.s4=Yakınlarda çamurlu bir çizme duruyor. Onu inceleyin: examine muddy_boot
tutorial.practice.s5=Ortak bir iz paylaşan iki ipucu. Onları birleştirin: combine torn_letter muddy_boot
tutorial.practice.s6=Kanıt hazır. Şimdi şüpheliye — doğuya adım atın: move east
tutorial.practice.s7=Onu suçlamadan önce uşağı dinleyin: question the valet
tutorial.practice.s8=Yalan söylüyor. Mazeretini çizmeyle bozun: contradict muddy_boot with the valet
tutorial.practice.s9=Muhteşem — gerçek artık sizin. Cidden hazır olduğunuzda, onu işaret edeceğiniz yer Final Sınavı'dır. Zanaati öğrendiniz, dedektif. continue yazın.

