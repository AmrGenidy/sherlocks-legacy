# --- Tutorial step copy (Watson's voice; command names stay Latin) ---
tutorial.move.s1=We begin with your feet, detective. You are in the Study. To step east into the Parlour, type: move east
tutorial.move.s2=Well done — a new room, a new view. Now return by pressing the "west: Study" button in the Neighbouring rooms panel on the right.
tutorial.move.s3=Just so. Following a trail is nothing more than moving room to room. Type continue when you are ready.
tutorial.look.s1=When a room's details slip your mind, simply look again. Type: look
tutorial.look.s2=There — the room, its contents and its exits, set down afresh. Lean on 'look' whenever your memory needs a nudge. Type continue.
tutorial.examine.s1=Every case turns on small things. A torn letter lies on the desk. Examine it — type: examine torn_letter
tutorial.examine.s2=Good. Its description is printed for you and saved to your Journal. Now examine the other clue: examine muddy_boot
tutorial.examine.s3=Two clues gathered already. To examine is the detective's very first instinct. Type continue.
tutorial.question.s1=The valet keeps to the Parlour, just east of the Study. Step through to reach him — type: move east
tutorial.question.s2=A suspect is of little use until he speaks. Now question the valet — type: question the valet
tutorial.question.s3=His statement is set down in your Journal. Hold it close, for suspects do not always tell the truth. Type continue.
tutorial.deduce.s1=To deduce is to draw a firm conclusion from a clue — but it spends an Insight Token, so choose your moment. Try: deduce torn_letter
tutorial.deduce.s2=A sharper insight, and saved to your Journal. Spend your tokens where they matter most. Type continue.
tutorial.contradict.s1=To break a lie you must first hold the proof. Examine the muddy boot — type: examine muddy_boot
tutorial.contradict.s2=Now carry that proof to the man himself. Step east to the Parlour: move east
tutorial.contradict.s3=The valet swears he never left the kitchen. Confront him with the boot. Type exactly: contradict muddy_boot with the valet
tutorial.contradict.s4=His alibi falls to pieces! Mind the order: the evidence first, then 'with', then the suspect. Type continue.
tutorial.combine.s1=Two clues may say more together than apart. First gather them both. Type: examine torn_letter
tutorial.combine.s2=And now the second: examine muddy_boot
tutorial.combine.s3=Now weave them into one. Type: combine torn_letter muddy_boot
tutorial.combine.s4=A new deduction, greater than its parts. Combine clues whenever they seem to share a thread. Type continue.
tutorial.journal.s1=Your Journal keeps every clue you uncover. Open it — type: journal (or click Journal above).
tutorial.journal.s2=You may also keep notes of your own. Add one — type: journal add The valet seemed nervous — or just type The valet seemed nervous in the Journal window and press the Add note button.
tutorial.journal.s3=Saved. A tidy journal is a detective's surest memory. Type continue.
tutorial.tasks.s1=Unsure where to turn next? Your current leads live in Tasks. Type: tasks (or click Tasks above).
tutorial.tasks.s2=Keep one eye on your tasks — they point the way when a case grows tangled. Type continue.
tutorial.pinboard.s1=Everything you've gathered is already on the board — the clues, the valet's statement, and the valet himself. Open the Pinboard from the top bar.
tutorial.pinboard.s2=Turn on Link mode, then click the valet's statement and the muddy boot to draw a thread between the lie and the proof that breaks it.
tutorial.pinboard.s3=Now expose the lie from the board: select the valet's statement and the muddy boot, then press Contradict.
tutorial.pinboard.s4=Deductions are forged here too. Select the torn letter and the muddy boot, then press Combine.
tutorial.pinboard.s5=That is the detective's craft, done by hand on the board. Type continue.
tutorial.askWatson.s1=When the trail runs cold, I am always glad to offer a thought. Ask me — type: ask watson
tutorial.askWatson.s2=You may also ask about something particular. Type: ask watson torn_letter
tutorial.askWatson.s3=A friend in the fog, if I may say so. Some questions cost an Insight Token, so ask with purpose. Type continue.
tutorial.finalExam.s1=When at last you can name the culprit, the Final Exam awaits. Type 'final exam' (or click Final exam above) to begin.
tutorial.finalExam.s2=Two questions remain. Answer the first here in the terminal — type the choice numbers for both blanks: 1,1
tutorial.finalExam.s3=Now answer the second question in the exam window: choose an option for the blank and press Submit.
tutorial.finalExam.s4=Both ways mastered — by terminal and by the exam window. Your rank is shown. Type continue.
tutorial.practice.s1=This is your graduation, detective — a whole case, from first clue to final word. Take your time; nothing here can go wrong. Type continue to begin.
tutorial.practice.s2=A torn letter lies on the desk. Begin as we always do — examine torn_letter
tutorial.practice.s3=Now draw a conclusion from it: deduce torn_letter
tutorial.practice.s4=A muddy boot sits nearby. Examine it: examine muddy_boot
tutorial.practice.s5=Two clues that share a thread. Combine them: combine torn_letter muddy_boot
tutorial.practice.s6=The evidence is ready. Now to the suspect — step east: move east
tutorial.practice.s7=Hear the valet out before you accuse him: question the valet
tutorial.practice.s8=He lies. Break his alibi with the boot: contradict muddy_boot with the valet
tutorial.practice.s9=Magnificent — the truth is yours. When you are ready in earnest, the Final Exam is where you would name him. You have learned the craft, detective. Type continue.

