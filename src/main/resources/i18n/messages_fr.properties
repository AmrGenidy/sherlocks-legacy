# --- Tutorial step copy (Watson's voice; command names stay Latin) ---
tutorial.move.s1=Commençons par vos pieds, détective. Vous êtes dans le Cabinet. Pour passer à l'est dans le Salon, tapez : move east
tutorial.move.s2=Bien joué — une nouvelle pièce, une nouvelle vue. Revenez maintenant en appuyant sur le bouton "west: Study" dans le panneau des pièces voisines à droite.
tutorial.move.s3=Voilà. Suivre une piste n'est rien de plus que passer de pièce en pièce. Tapez continue quand vous serez prêt.
tutorial.look.s1=Quand les détails d'une pièce vous échappent, observez simplement de nouveau. Tapez : look
tutorial.look.s2=Voilà — la pièce, son contenu et ses sorties, consignés à nouveau. Appuyez-vous sur 'look' chaque fois que votre mémoire a besoin d'un coup de pouce. Tapez continue.
tutorial.examine.s1=Toute affaire repose sur de petites choses. Une lettre déchirée gît sur le bureau. Examinez-la — tapez : examine torn_letter
tutorial.examine.s2=Bien. Sa description s'affiche pour vous et s'enregistre dans votre Journal. Examinez maintenant l'autre indice : examine muddy_boot
tutorial.examine.s3=Deux indices déjà recueillis. Examiner est le tout premier instinct du détective. Tapez continue.
tutorial.question.s1=Le valet reste dans le Salon, à l'est du Bureau. Rejoignez-le — tapez : move east
tutorial.question.s2=Un suspect n'est guère utile tant qu'il ne parle pas. Interrogez maintenant le valet — tapez : question the valet
tutorial.question.s3=Sa déposition est consignée dans votre Journal. Gardez-la à l'esprit, car les suspects ne disent pas toujours la vérité. Tapez continue.
tutorial.deduce.s1=Déduire, c'est tirer une conclusion ferme d'un indice — mais cela dépense un Jeton de perspicacité, alors choisissez bien votre moment. Essayez : deduce torn_letter
tutorial.deduce.s2=Une intuition plus aiguisée, et enregistrée dans votre Journal. Dépensez vos jetons là où ils comptent le plus. Tapez continue.
tutorial.contradict.s1=Pour démasquer un mensonge, il vous faut d'abord détenir la preuve. Examinez la botte boueuse — tapez : examine muddy_boot
tutorial.contradict.s2=Portez maintenant cette preuve à l'homme lui-même. Passez à l'est dans le Salon : move east
tutorial.contradict.s3=Le valet jure qu'il n'a jamais quitté la cuisine. Confrontez-le à la botte. Tapez exactement : contradict muddy_boot with the valet
tutorial.contradict.s4=Son alibi vole en éclats ! Attention à l'ordre : la preuve d'abord, puis 'with', puis le suspect. Tapez continue.
tutorial.combine.s1=Deux indices peuvent en dire plus ensemble que séparément. Rassemblez-les d'abord tous les deux. Tapez : examine torn_letter
tutorial.combine.s2=Et maintenant le second : examine muddy_boot
tutorial.combine.s3=Tissez-les à présent en un seul. Tapez : combine torn_letter muddy_boot
tutorial.combine.s4=Une nouvelle déduction, plus grande que la somme de ses parties. Combinez les indices chaque fois qu'ils semblent partager un fil. Tapez continue.
tutorial.journal.s1=Votre Journal conserve chaque indice que vous découvrez. Ouvrez-le — tapez : journal (ou cliquez sur Journal ci-dessus).
tutorial.journal.s2=Vous pouvez aussi prendre vos propres notes. Ajoutez-en une — tapez : journal add The valet seemed nervous — ou saisissez simplement The valet seemed nervous dans la fenêtre du Journal et appuyez sur le bouton Ajouter une note.
tutorial.journal.s3=Enregistré. Un journal bien tenu est la mémoire la plus sûre du détective. Tapez continue.
tutorial.tasks.s1=Vous ne savez où vous tourner ensuite ? Vos pistes actuelles figurent dans les Tâches. Tapez : tasks (ou cliquez sur Tâches ci-dessus).
tutorial.tasks.s2=Gardez un œil sur vos tâches — elles montrent le chemin quand une affaire se complique. Tapez continue.
tutorial.pinboard.s1=Tout ce que vous avez réuni est déjà sur le tableau — les indices, la déposition du valet et le valet lui-même. Ouvrez le Tableau d'enquête depuis la barre du haut.
tutorial.pinboard.s2=Activez le Mode liaison, puis cliquez sur la déposition du valet et sur la botte boueuse pour tracer un fil entre le mensonge et la preuve.
tutorial.pinboard.s3=Exposez maintenant le mensonge depuis le tableau : sélectionnez la déposition du valet et la botte boueuse, puis appuyez sur Contredire.
tutorial.pinboard.s4=Les déductions se forgent aussi ici. Sélectionnez la lettre déchirée et la botte boueuse, puis appuyez sur Combiner.
tutorial.pinboard.s5=Voilà tout l'art du détective, fait à la main sur le tableau. Tapez continue.
tutorial.askWatson.s1=Quand la piste se refroidit, je suis toujours heureux d'offrir une idée. Demandez-moi — tapez : ask watson
tutorial.askWatson.s2=Vous pouvez aussi me questionner sur un point précis. Tapez : ask watson torn_letter
tutorial.askWatson.s3=Un ami dans le brouillard, si je puis dire. Certaines questions coûtent un Jeton de perspicacité, alors demandez à dessein. Tapez continue.
tutorial.finalExam.s1=Quand vous pourrez enfin nommer le coupable, l'Examen final vous attendra. Tapez 'final exam' (ou cliquez sur Examen final ci-dessus) pour commencer.
tutorial.finalExam.s2=Il reste deux questions. Répondez à la première ici dans le terminal — tapez les numéros de choix pour les deux blancs : 1,1
tutorial.finalExam.s3=Répondez maintenant à la deuxième question dans la fenêtre d'examen : choisissez une option pour le blanc et appuyez sur Envoyer.
tutorial.finalExam.s4=Les deux voies maîtrisées — par le terminal et par la fenêtre d'examen. Votre rang est affiché. Tapez continue.
tutorial.practice.s1=Voici votre examen de passage, détective — une affaire entière, du premier indice au mot final. Prenez votre temps ; rien ici ne peut mal tourner. Tapez continue pour commencer.
tutorial.practice.s2=Une lettre déchirée gît sur le bureau. Commencez comme nous le faisons toujours — examine torn_letter
tutorial.practice.s3=Tirez-en maintenant une conclusion : deduce torn_letter
tutorial.practice.s4=Une botte boueuse se trouve à proximité. Examinez-la : examine muddy_boot
tutorial.practice.s5=Deux indices qui partagent un fil. Combinez-les : combine torn_letter muddy_boot
tutorial.practice.s6=La preuve est prête. Au suspect maintenant — passez à l'est : move east
tutorial.practice.s7=Écoutez le valet avant de l'accuser : question the valet
tutorial.practice.s8=Il ment. Brisez son alibi avec la botte : contradict muddy_boot with the valet
tutorial.practice.s9=Magnifique — la vérité est à vous. Quand vous serez prêt pour de bon, c'est à l'Examen final que vous le nommeriez. Vous avez appris le métier, détective. Tapez continue.

