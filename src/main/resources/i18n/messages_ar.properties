# --- نصوص خطوات الدروس (بصوت واطسون؛ أسماء الأوامر تبقى لاتينية) ---
tutorial.move.s1=لنبدأ بخطواتك يا عزيزي المحقق. أنت الآن في المكتب (Study). للانتقال شرقًا إلى الصالة (Parlour)، اكتب: move east
tutorial.move.s2=أحسنت — غرفة جديدة ومنظر جديد. عُد الآن بالضغط على زر "west: Study" في لوحة الغرف المجاورة على اليمين.
tutorial.move.s3=هكذا تمامًا. تتبّع الأثر ليس إلا تنقّلًا بين الغرف. اكتب continue حين تكون مستعدًا.
tutorial.look.s1=إذا غابت عنك تفاصيل الغرفة، فانظر من جديد. اكتب: look
tutorial.look.s2=ها هي الغرفة ومحتوياتها ومخارجها مدوّنة من جديد. اعتمد على 'look' كلما احتجت إلى تذكير. اكتب continue.
tutorial.examine.s1=كل قضية تدور حول التفاصيل الصغيرة. ثمّة رسالة ممزّقة على المكتب. افحصها — اكتب: examine torn_letter
tutorial.examine.s2=جيد. وصفها مطبوع أمامك ومحفوظ في دفترك. والآن افحص الدليل الآخر: examine muddy_boot
tutorial.examine.s3=دليلان بالفعل. الفحص هو أول غريزة لدى المحقق. اكتب continue.
tutorial.question.s1=الخادم يلزم الصالة، إلى الشرق من المكتب. اعبر إليه — اكتب: move east
tutorial.question.s2=لا نفع من مشتبه به ما لم يتكلّم. والآن استجوب الخادم — اكتب: question the valet
tutorial.question.s3=أُثبتت أقواله في دفترك. احتفظ بها، فالمشتبه بهم لا يقولون الحقيقة دائمًا. اكتب continue.
tutorial.deduce.s1=أن تستنتج يعني أن تستخلص نتيجة قاطعة من دليل — لكنه يكلّفك رمز بصيرة، فاختر لحظتك. جرّب: deduce torn_letter
tutorial.deduce.s2=بصيرة أحدّ، ومحفوظة في دفترك. أنفق رموزك حيث تنفع أكثر. اكتب continue.
tutorial.contradict.s1=لكي تكسر كذبة، عليك أولًا أن تمسك بالدليل. افحص الحذاء الموحل — اكتب: examine muddy_boot
tutorial.contradict.s2=الآن احمل هذا الدليل إلى الرجل نفسه. اتجه شرقًا إلى الصالة: move east
tutorial.contradict.s3=يُقسم الخادم أنه لم يغادر المطبخ قط. واجهه بالحذاء. اكتب تمامًا: contradict muddy_boot with the valet
tutorial.contradict.s4=انهارت حجّته! انتبه للترتيب: الدليل أولًا، ثم 'with'، ثم المشتبه به. اكتب continue.
tutorial.combine.s1=قد يقول دليلان معًا أكثر مما يقولان منفردين. اجمعهما أولًا. اكتب: examine torn_letter
tutorial.combine.s2=والآن الثاني: examine muddy_boot
tutorial.combine.s3=الآن انسجهما في واحد. اكتب: combine torn_letter muddy_boot
tutorial.combine.s4=استنتاج جديد، أكبر من جزأيه. اجمع الأدلة كلما بدت تتشارك خيطًا واحدًا. اكتب continue.
tutorial.journal.s1=يحفظ دفترك كل دليل تكتشفه. افتحه — اكتب: journal (أو انقر دفتر التحقيق في الأعلى).
tutorial.journal.s2=يمكنك أيضًا تدوين ملاحظاتك الخاصة. أضف واحدة — اكتب: journal add The valet seemed nervous — أو اكتب ببساطة The valet seemed nervous في نافذة اليوميات واضغط على زر إضافة ملاحظة.
tutorial.journal.s3=حُفظت. الدفتر المرتّب هو أوثق ذاكرة للمحقق. اكتب continue.
tutorial.tasks.s1=أتحتار أين تتجه؟ خيوطك الحالية في قائمة المهام. اكتب: tasks (أو انقر المهام في الأعلى).
tutorial.tasks.s2=أبقِ عينًا على مهامك — فهي تدلّك على الطريق حين تتشابك القضية. اكتب continue.
tutorial.pinboard.s1=كل ما جمعته موجود على اللوحة بالفعل — الأدلة، وإفادة الخادم، والخادم نفسه. افتح لوحة الأدلة من الشريط العلوي.
tutorial.pinboard.s2=فعِّل وضع الربط، ثم انقر إفادة الخادم والحذاء الموحل لترسم خيطًا بين الكذبة والدليل الذي يكسرها.
tutorial.pinboard.s3=الآن اكشف الكذبة من اللوحة: اختر إفادة الخادم والحذاء الموحل، ثم اضغط المواجهة.
tutorial.pinboard.s4=وتُصاغ الاستنتاجات هنا أيضًا. اختر الرسالة الممزقة والحذاء الموحل، ثم اضغط الدمج.
tutorial.pinboard.s5=تلك هي حرفة المحقق، مُنجَزة باليد على اللوحة. اكتب continue.
tutorial.askWatson.s1=حين يبرد الأثر، يسعدني دائمًا أن أبدي رأيًا. اسألني — اكتب: ask watson
tutorial.askWatson.s2=يمكنك أيضًا السؤال عن شيء بعينه. اكتب: ask watson torn_letter
tutorial.askWatson.s3=رفيق في الضباب، إن جاز لي القول. بعض الأسئلة تكلّف رمز بصيرة، فاسأل بهدف. اكتب continue.
tutorial.finalExam.s1=حين تستطيع أخيرًا تسمية الجاني، ينتظرك الاختبار النهائي. اكتب 'final exam' (أو انقر الاختبار النهائي في الأعلى) لتبدأ.
tutorial.finalExam.s2=بقي سؤالان. أجب عن الأول هنا في الطرفية — اكتب أرقام الخيارين للفراغين: 1,1
tutorial.finalExam.s3=الآن أجب عن السؤال الثاني في نافذة الاختبار: اختر خيارًا للفراغ واضغط إرسال.
tutorial.finalExam.s4=أتقنت الطريقتين — عبر الطرفية وعبر نافذة الاختبار. تظهر رتبتك. اكتب continue.
tutorial.practice.s1=هذا تخرّجك يا عزيزي المحقق — قضية كاملة، من أول دليل إلى الكلمة الأخيرة. خذ وقتك؛ لا شيء هنا قد يخطئ. اكتب continue لتبدأ.
tutorial.practice.s2=رسالة ممزّقة على المكتب. ابدأ كما نبدأ دائمًا — examine torn_letter
tutorial.practice.s3=الآن استخلص منها نتيجة: deduce torn_letter
tutorial.practice.s4=حذاء موحل قريب منك. افحصه: examine muddy_boot
tutorial.practice.s5=دليلان يتشاركان خيطًا. اجمعهما: combine torn_letter muddy_boot
tutorial.practice.s6=الدليل جاهز. والآن إلى المشتبه به — اتجه شرقًا: move east
tutorial.practice.s7=اسمع الخادم قبل أن تتهمه: question the valet
tutorial.practice.s8=إنه يكذب. اكسر حجّته بالحذاء: contradict muddy_boot with the valet
tutorial.practice.s9=رائع — الحقيقة بين يديك. وحين تكون مستعدًا حقًا، فالاختبار النهائي هو حيث تسمّيه. لقد أتقنت الحرفة يا عزيزي المحقق. اكتب continue.

