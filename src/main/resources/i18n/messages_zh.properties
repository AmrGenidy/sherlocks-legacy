# --- Tutorial step copy (Watson's voice; command names stay Latin) ---
tutorial.move.s1=侦探，我们先从你的脚下说起。你正身处书房。要向东踏入客厅，请输入：move east
tutorial.move.s2=做得好——新的房间，新的景象。现在点击右侧“相邻房间”面板中的“west: Study”按钮返回。
tutorial.move.s3=正是如此。追踪线索，不过是在房间之间走动罢了。准备好后，请输入 continue。
tutorial.look.s1=当房间的细节从记忆中溜走时，只需再看一眼。请输入：look
tutorial.look.s2=瞧——房间、它的陈设与出口，又重新呈现在眼前。每当记忆需要提醒时，就倚仗 'look' 吧。请输入 continue。
tutorial.examine.s1=每桩案件都系于细微之处。书桌上躺着一封撕碎的信。检查它——请输入：examine torn_letter
tutorial.examine.s2=很好。它的描述已为你打印出来，并存入了你的日志。现在检查另一条线索：examine muddy_boot
tutorial.examine.s3=转眼已收集到两条线索。检查，乃侦探的第一本能。请输入 continue。
tutorial.question.s1=男仆总待在客厅，就在书房以东。前去找他——请输入：move east
tutorial.question.s2=嫌疑人不开口，便无甚用处。现在审问男仆——请输入：question the valet
tutorial.question.s3=他的陈述已记入你的日志。务必留心，嫌疑人未必总说真话。请输入 continue。
tutorial.deduce.s1=推断，是从一条线索得出确凿的结论——但它会耗去一枚洞察令牌，故须择机而行。试试看：deduce torn_letter
tutorial.deduce.s2=一份更敏锐的洞察，已存入你的日志。把令牌花在最要紧之处。请输入 continue。
tutorial.contradict.s1=要戳穿一个谎言，你须先握有证据。检查那只沾泥的靴子——请输入：examine muddy_boot
tutorial.contradict.s2=现在把这份证据带到那人面前。向东踏入客厅：move east
tutorial.contradict.s3=男仆发誓他从未离开过厨房。用那只靴子当面驳斥他。请准确输入：contradict muddy_boot with the valet
tutorial.contradict.s4=他的不在场证明顷刻瓦解！注意顺序：先是证据，然后 'with'，最后才是嫌疑人。请输入 continue。
tutorial.combine.s1=两条线索合在一起，往往比分开时道出更多。先把它们都收集起来。请输入：examine torn_letter
tutorial.combine.s2=现在是第二条：examine muddy_boot
tutorial.combine.s3=现在把它们编织成一处。请输入：combine torn_letter muddy_boot
tutorial.combine.s4=一项新的推断，胜过其各部分之和。每当线索似有一线相连，就把它们组合起来。请输入 continue。
tutorial.journal.s1=你的日志记下你所揭开的每一条线索。打开它——请输入：journal（或点击上方的“日志”）。
tutorial.journal.s2=你也可以记录自己的笔记。添加一条——输入：journal add The valet seemed nervous——或者直接在日志窗口中输入 The valet seemed nervous，然后点击“添加笔记”按钮。
tutorial.journal.s3=已保存。一本整洁的日志，是侦探最可靠的记忆。请输入 continue。
tutorial.tasks.s1=不知下一步该往何处？你当前的线索都列在“任务”里。请输入：tasks（或点击上方的“任务”）。
tutorial.tasks.s2=对你的任务多留一只眼——当案情错综复杂时，它们会为你指明方向。请输入 continue。
tutorial.pinboard.s1=你所搜集的一切都已在板上——线索、男仆的陈述，还有男仆本人。请从顶部栏打开线索板。
tutorial.pinboard.s2=打开连线模式，然后点击男仆的陈述与那只沾泥的靴子，在谎言与揭穿它的证据之间牵起一线。
tutorial.pinboard.s3=现在从板上揭穿谎言：选中男仆的陈述与沾泥的靴子，然后按下“驳斥”。
tutorial.pinboard.s4=推断也在此锻成。选中撕破的信与沾泥的靴子，然后按下“组合”。
tutorial.pinboard.s5=这便是侦探的手艺，在板上亲手完成。请输入 continue。
tutorial.askWatson.s1=当线索陷入冰冷时，我总乐意献上一点想法。请教我——请输入：ask watson
tutorial.askWatson.s2=你也可以就某件具体之事相问。请输入：ask watson torn_letter
tutorial.askWatson.s3=恕我直言，乃迷雾中的一位友人。有些问题需耗去一枚洞察令牌，故请有的放矢。请输入 continue。
tutorial.finalExam.s1=当你终能指认真凶时，最终审问便在等候。输入 'final exam'（或点击上方的“最终审问”）以开始。
tutorial.finalExam.s2=还剩两道题。第一道在终端作答——输入两个空位的选项编号：1,1
tutorial.finalExam.s3=现在在审问窗口作答第二道题：为空位选择一个选项并按“提交”。
tutorial.finalExam.s4=两种方式皆已掌握——终端与审问窗口。你的等级已显示。请输入 continue。
tutorial.practice.s1=侦探，这便是你的毕业之时——一桩完整的案件，从第一条线索到最终的定论。慢慢来；此处无论怎样都不会出错。输入 continue 以开始。
tutorial.practice.s2=书桌上躺着一封撕碎的信。一如既往地着手——examine torn_letter
tutorial.practice.s3=现在从中得出一个结论：deduce torn_letter
tutorial.practice.s4=附近放着一只沾泥的靴子。检查它：examine muddy_boot
tutorial.practice.s5=两条相连的线索。把它们组合起来：combine torn_letter muddy_boot
tutorial.practice.s6=证据已备齐。现在去找嫌疑人——向东走：move east
tutorial.practice.s7=在指控男仆之前，先听他把话说完：question the valet
tutorial.practice.s8=他在撒谎。用那只靴子戳穿他的不在场证明：contradict muddy_boot with the valet
tutorial.practice.s9=精彩——真相已归你所有。等你当真准备好时，便是在最终审问中指认他的时候。侦探，你已习得这门技艺。请输入 continue。

