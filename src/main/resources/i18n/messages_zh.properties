help.cmd.look=显示当前房间的描述、物品、在场者与出口。
help.cmd.move=朝该方向移动到相邻的房间。
help.cmd.examine=检查一件物品以了解详情，并将其笔记加入日志（多人游戏中共享）。
help.cmd.question=审问一名嫌疑人以听取其陈述，并将其笔记加入日志（多人游戏中共享）。
