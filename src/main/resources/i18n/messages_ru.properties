# --- Текст шагов обучения (голосом Ватсона; названия команд остаются латиницей) ---
tutorial.move.s1=Начнём с ваших ног, детектив. Вы в Кабинете (Study). Чтобы шагнуть на восток в Гостиную (Parlour), введите: move east
tutorial.move.s2=Отлично — новая комната, новый вид. Теперь вернитесь, нажав кнопку "west: Study" на панели соседних комнат справа.
tutorial.move.s3=Именно так. Идти по следу — значит просто переходить из комнаты в комнату. Введите continue, когда будете готовы.
tutorial.look.s1=Если детали комнаты вылетели из головы, просто осмотритесь снова. Введите: look
tutorial.look.s2=Вот — комната, её содержимое и выходы, записаны заново. Полагайтесь на 'look' всякий раз, когда памяти нужна подсказка. Введите continue.
tutorial.examine.s1=Любое дело держится на мелочах. На столе лежит разорванное письмо. Осмотрите его — введите: examine torn_letter
tutorial.examine.s2=Хорошо. Его описание выведено и сохранено в Журнал. Теперь осмотрите вторую улику: examine muddy_boot
tutorial.examine.s3=Уже две улики. Осматривать — первейший инстинкт детектива. Введите continue.
tutorial.question.s1=Камердинер держится Гостиной, к востоку от Кабинета. Пройдите к нему — введите: move east
tutorial.question.s2=От подозреваемого мало проку, пока он молчит. Теперь допросите камердинера — введите: question the valet
tutorial.question.s3=Его показания записаны в Журнал. Держите их при себе — подозреваемые не всегда говорят правду. Введите continue.
tutorial.deduce.s1=Сделать вывод — значит извлечь твёрдое заключение из улики, но это стоит жетон озарения, так что выбирайте момент. Попробуйте: deduce torn_letter
tutorial.deduce.s2=Более острое озарение, и оно в вашем Журнале. Тратьте жетоны там, где они важнее всего. Введите continue.
tutorial.contradict.s1=Чтобы сломать ложь, сперва нужно держать в руках доказательство. Осмотрите грязный ботинок — введите: examine muddy_boot
tutorial.contradict.s2=Теперь отнесите это доказательство самому человеку. Шагните на восток в Гостиную: move east
tutorial.contradict.s3=Камердинер клянётся, что не покидал кухни. Уличите его ботинком. Введите в точности: contradict muddy_boot with the valet
tutorial.contradict.s4=Его алиби рассыпается! Запомните порядок: сначала улика, затем 'with', затем подозреваемый. Введите continue.
tutorial.combine.s1=Две улики вместе могут сказать больше, чем порознь. Сначала соберите обе. Введите: examine torn_letter
tutorial.combine.s2=А теперь вторую: examine muddy_boot
tutorial.combine.s3=Теперь сплетите их воедино. Введите: combine torn_letter muddy_boot
tutorial.combine.s4=Новый вывод, больший, чем его части. Сопоставляйте улики всякий раз, когда их объединяет общая нить. Введите continue.
tutorial.journal.s1=Ваш Журнал хранит каждую найденную улику. Откройте его — введите: journal (или нажмите Журнал вверху).
tutorial.journal.s2=Вы также можете вести собственные заметки. Добавьте одну — введите: journal add The valet seemed nervous — или просто напишите The valet seemed nervous в окне журнала и нажмите кнопку добавления заметки.
tutorial.journal.s3=Сохранено. Аккуратный журнал — самая надёжная память детектива. Введите continue.
tutorial.tasks.s1=Не знаете, куда двинуться дальше? Ваши текущие зацепки — в Задачах. Введите: tasks (или нажмите Задачи вверху).
tutorial.tasks.s2=Поглядывайте на задачи — они укажут путь, когда дело запутается. Введите continue.
tutorial.pinboard.s1=Всё собранное уже на доске — улики, показания камердинера и сам камердинер. Откройте Доску улик на верхней панели.
tutorial.pinboard.s2=Включите режим связей, затем щёлкните показания камердинера и грязный сапог, чтобы протянуть нить между ложью и уликой, что её опровергает.
tutorial.pinboard.s3=Теперь уличите ложь с доски: выберите показания камердинера и грязный сапог, затем нажмите Уличить.
tutorial.pinboard.s4=Здесь же куются и дедукции. Выберите разорванное письмо и грязный сапог, затем нажмите Сопоставить.
tutorial.pinboard.s5=Вот всё мастерство сыщика, сделанное вручную на доске. Введите continue.
tutorial.askWatson.s1=Когда след остывает, я всегда рад поделиться мыслью. Спросите меня — введите: ask watson
tutorial.askWatson.s2=Можно также спросить о чём-то определённом. Введите: ask watson torn_letter
tutorial.askWatson.s3=Друг в тумане, если позволите. Некоторые вопросы стоят жетон озарения, так что спрашивайте с умыслом. Введите continue.
tutorial.finalExam.s1=Когда вы наконец сможете назвать виновного, вас ждёт Финальный экзамен. Введите 'final exam' (или нажмите Финальный экзамен вверху), чтобы начать.
tutorial.finalExam.s2=Осталось два вопроса. Ответьте на первый здесь, в терминале — введите номера вариантов для обоих пропусков: 1,1
tutorial.finalExam.s3=Теперь ответьте на второй вопрос в окне экзамена: выберите вариант для пропуска и нажмите «Отправить».
tutorial.finalExam.s4=Оба способа освоены — через терминал и через окно экзамена. Ваш ранг показан. Введите continue.
tutorial.practice.s1=Это ваш выпуск, детектив — целое дело, от первой улики до последнего слова. Не торопитесь; здесь ничто не может пойти не так. Введите continue, чтобы начать.
tutorial.practice.s2=На столе лежит разорванное письмо. Начните, как всегда — examine torn_letter
tutorial.practice.s3=Теперь сделайте из него вывод: deduce torn_letter
tutorial.practice.s4=Рядом — грязный ботинок. Осмотрите его: examine muddy_boot
tutorial.practice.s5=Две улики связаны одной нитью. Сопоставьте их: combine torn_letter muddy_boot
tutorial.practice.s6=Доказательство готово. Теперь к подозреваемому — шагните на восток: move east
tutorial.practice.s7=Выслушайте камердинера, прежде чем обвинять: question the valet
tutorial.practice.s8=Он лжёт. Сломайте его алиби ботинком: contradict muddy_boot with the valet
tutorial.practice.s9=Великолепно — истина в ваших руках. Когда будете готовы всерьёз, именно на Финальном экзамене вы его назовёте. Вы освоили ремесло, детектив. Введите continue.

