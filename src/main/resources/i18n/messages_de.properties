# --- Tutorial step copy (Watson's voice; command names stay Latin) ---
tutorial.move.s1=Wir beginnen mit Ihren Füßen, Detektiv. Sie sind im Arbeitszimmer. Um nach Osten in den Salon zu treten, tippen Sie: move east
tutorial.move.s2=Gut gemacht — ein neuer Raum, eine neue Ansicht. Kehre nun zurück, indem du im Panel der Nachbarräume rechts auf die Schaltfläche "west: Study" drückst.
tutorial.move.s3=Genau so. Einer Spur zu folgen heißt nichts weiter, als von Raum zu Raum zu gehen. Tippen Sie continue, wenn Sie bereit sind.
tutorial.look.s1=Wenn Ihnen die Einzelheiten eines Raumes entfallen, sehen Sie sich einfach erneut um. Tippen Sie: look
tutorial.look.s2=Da — der Raum, sein Inhalt und seine Ausgänge, aufs Neue dargelegt. Verlassen Sie sich auf 'look', sooft Ihr Gedächtnis einen Anstoß braucht. Tippen Sie continue.
tutorial.examine.s1=Jeder Fall hängt an Kleinigkeiten. Ein zerrissener Brief liegt auf dem Schreibtisch. Untersuchen Sie ihn — tippen Sie: examine torn_letter
tutorial.examine.s2=Gut. Seine Beschreibung wird Ihnen ausgegeben und in Ihrem Journal gespeichert. Untersuchen Sie nun den anderen Hinweis: examine muddy_boot
tutorial.examine.s3=Schon zwei Hinweise gesammelt. Zu untersuchen ist der allererste Instinkt des Detektivs. Tippen Sie continue.
tutorial.question.s1=Der Diener hält sich im Salon auf, östlich vom Arbeitszimmer. Gehen Sie zu ihm — tippen Sie: move east
tutorial.question.s2=Ein Verdächtiger nützt wenig, bis er spricht. Befragen Sie nun den Diener — tippen Sie: question the valet
tutorial.question.s3=Seine Aussage ist in Ihrem Journal festgehalten. Behalten Sie sie im Blick, denn Verdächtige sagen nicht immer die Wahrheit. Tippen Sie continue.
tutorial.deduce.s1=Schlussfolgern heißt, aus einem Hinweis einen festen Schluss zu ziehen — doch es kostet eine Erkenntnis-Marke, also wählen Sie Ihren Moment. Versuchen Sie: deduce torn_letter
tutorial.deduce.s2=Eine schärfere Erkenntnis, und in Ihrem Journal gespeichert. Setzen Sie Ihre Marken dort ein, wo sie am meisten zählen. Tippen Sie continue.
tutorial.contradict.s1=Um eine Lüge zu brechen, müssen Sie zuerst den Beweis in Händen halten. Untersuchen Sie den schlammigen Stiefel — tippen Sie: examine muddy_boot
tutorial.contradict.s2=Tragen Sie diesen Beweis nun zu dem Mann selbst. Treten Sie nach Osten in den Salon: move east
tutorial.contradict.s3=Der Diener schwört, er habe die Küche nie verlassen. Halten Sie ihm den Stiefel entgegen. Tippen Sie genau: contradict muddy_boot with the valet
tutorial.contradict.s4=Sein Alibi zerfällt in Stücke! Achten Sie auf die Reihenfolge: zuerst der Beweis, dann 'with', dann der Verdächtige. Tippen Sie continue.
tutorial.combine.s1=Zwei Hinweise sagen zusammen oft mehr als einzeln. Sammeln Sie zuerst beide. Tippen Sie: examine torn_letter
tutorial.combine.s2=Und nun der zweite: examine muddy_boot
tutorial.combine.s3=Verweben Sie sie nun zu einem. Tippen Sie: combine torn_letter muddy_boot
tutorial.combine.s4=Eine neue Schlussfolgerung, größer als ihre Teile. Kombinieren Sie Hinweise, sooft sie einen gemeinsamen Faden zu teilen scheinen. Tippen Sie continue.
tutorial.journal.s1=Ihr Journal bewahrt jeden Hinweis, den Sie aufdecken. Öffnen Sie es — tippen Sie: journal (oder klicken Sie oben auf Journal).
tutorial.journal.s2=Du kannst auch eigene Notizen machen. Füge eine hinzu — tippe: journal add The valet seemed nervous — oder schreibe einfach The valet seemed nervous im Journal-Fenster und drücke die Schaltfläche Notiz hinzufügen.
tutorial.journal.s3=Gespeichert. Ein ordentliches Journal ist das sicherste Gedächtnis eines Detektivs. Tippen Sie continue.
tutorial.tasks.s1=Sie wissen nicht, wohin als Nächstes? Ihre aktuellen Spuren stehen in den Aufgaben. Tippen Sie: tasks (oder klicken Sie oben auf Aufgaben).
tutorial.tasks.s2=Behalten Sie Ihre Aufgaben im Auge — sie weisen den Weg, wenn ein Fall verworren wird. Tippen Sie continue.
tutorial.pinboard.s1=Alles Gesammelte liegt bereits auf der Pinnwand — die Hinweise, die Aussage des Dieners und der Diener selbst. Öffnen Sie die Pinnwand über die obere Leiste.
tutorial.pinboard.s2=Schalten Sie den Verknüpfungsmodus ein und klicken Sie dann die Aussage des Dieners und den schlammigen Stiefel an, um einen Faden zwischen Lüge und Beweis zu ziehen.
tutorial.pinboard.s3=Decken Sie die Lüge nun von der Pinnwand aus auf: Wählen Sie die Aussage des Dieners und den schlammigen Stiefel und drücken Sie Widerlegen.
tutorial.pinboard.s4=Auch Schlussfolgerungen entstehen hier. Wählen Sie den zerrissenen Brief und den schlammigen Stiefel und drücken Sie Kombinieren.
tutorial.pinboard.s5=Das ist die Kunst des Detektivs, von Hand auf der Pinnwand. Tippen Sie continue.
tutorial.askWatson.s1=Wenn die Spur erkaltet, biete ich gern einen Gedanken an. Fragen Sie mich — tippen Sie: ask watson
tutorial.askWatson.s2=Sie können auch nach etwas Bestimmtem fragen. Tippen Sie: ask watson torn_letter
tutorial.askWatson.s3=Ein Freund im Nebel, wenn ich so sagen darf. Manche Fragen kosten eine Erkenntnis-Marke, also fragen Sie mit Bedacht. Tippen Sie continue.
tutorial.finalExam.s1=Wenn Sie endlich den Täter nennen können, wartet die Abschlussprüfung. Tippen Sie 'final exam' (oder klicken Sie oben auf Abschlussprüfung), um zu beginnen.
tutorial.finalExam.s2=Zwei Fragen bleiben. Beantworten Sie die erste hier im Terminal — tippen Sie die Wahlnummern für beide Lücken: 1,1
tutorial.finalExam.s3=Beantworten Sie nun die zweite Frage im Prüfungsfenster: Wählen Sie eine Option für die Lücke und drücken Sie Absenden.
tutorial.finalExam.s4=Beide Wege gemeistert — per Terminal und per Prüfungsfenster. Ihr Rang wird angezeigt. Tippen Sie continue.
tutorial.practice.s1=Dies ist Ihr Abschluss, Detektiv — ein ganzer Fall, vom ersten Hinweis bis zum letzten Wort. Lassen Sie sich Zeit; hier kann nichts schiefgehen. Tippen Sie continue, um zu beginnen.
tutorial.practice.s2=Ein zerrissener Brief liegt auf dem Schreibtisch. Beginnen Sie, wie wir es stets tun — examine torn_letter
tutorial.practice.s3=Ziehen Sie nun einen Schluss daraus: deduce torn_letter
tutorial.practice.s4=Ein schlammiger Stiefel steht in der Nähe. Untersuchen Sie ihn: examine muddy_boot
tutorial.practice.s5=Zwei Hinweise, die einen Faden teilen. Kombinieren Sie sie: combine torn_letter muddy_boot
tutorial.practice.s6=Der Beweis ist bereit. Nun zum Verdächtigen — treten Sie nach Osten: move east
tutorial.practice.s7=Hören Sie den Diener an, bevor Sie ihn beschuldigen: question the valet
tutorial.practice.s8=Er lügt. Brechen Sie sein Alibi mit dem Stiefel: contradict muddy_boot with the valet
tutorial.practice.s9=Großartig — die Wahrheit gehört Ihnen. Wenn Sie es ernsthaft wagen wollen, ist die Abschlussprüfung der Ort, an dem Sie ihn nennen würden. Sie haben das Handwerk gelernt, Detektiv. Tippen Sie continue.

